# Golden positives: real defects found by the 2026-10-26 audit (docs/code-review-findings.md).
#
# Each case is pinned to the code by `anchor`, an exact, unique substring of `file`. The line
# is resolved from the anchor at run time, so edits elsewhere in the file do not break it.
#   status: open   the defect is present; the anchor must be found exactly once
#   status: fixed  the defect was fixed; the anchor must be gone; a reviewer that still reports it
#                  at that place is counted as a false positive (regression guard)
# When you fix a defect, flip it to `fixed` in the same change as the fix.
#
# A reviewer finding matches a case when: same file, line within `tolerance` of the anchor line,
# and (its category equals `category` OR it mentions one of `keywords`, case-insensitive).
#
# fields: id, finding, severity, category (REVIEW.md catalog id), file, anchor, keywords,
#         summary, scenario, [context_files], [tolerance], [status]

- id: C-F01
  finding: F-01
  severity: critical
  category: BT-02
  file: loan_agent/rules/line_rules.py
  anchor: 'resline.effective_date = "12/24/2026"'
  keywords: ["hard-coded", "hardcoded", "12/24/2026", "tmp fix", "constant"]
  summary: A literal effective date and line id are written into the result line
  scenario: Any document matching an existing line yields a merged line dated 12/24/2026, and the 60-120 check then uses that constant instead of the document date.

- id: C-F02
  finding: F-02
  severity: critical
  category: BT-01
  file: loan_agent/rules/line_rules.py
  anchor: 'escrow = line.escrow_status == "Yes"'
  context_files: [loan_agent/screens/loan_detail/insurance_line.py]
  keywords: ["escrow", '"y"', "never true", "yes"]
  summary: Escrow is compared with "Yes" but every data source holds "Y", so payment is never prepared
  scenario: Escrowed loan with a renewal inside 60-120 days gets chk_make_payment False, no payment, policy lapses into lender-placed coverage.

