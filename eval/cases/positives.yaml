  anchor: 'an empty string is 0.0.'
  tolerance: 12
  keywords: ["empty", "blank", "0.0", "unknown", "missing", "none"]
  summary: An empty or blank numeric string is converted to 0.0, so a missing amount is indistinguishable from zero
  scenario: coverage_amount of an empty string loads as 0.0, the rule keep the App value if coverage is missing cannot fire, and a 0 can overwrite the loan.

